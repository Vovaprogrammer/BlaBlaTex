# yaml-language-server: $schema=../_schema/template.schema.json
# Отчёт по лабораторной или практической работе МТУСИ — один шаблон на все дисциплины.
# Дисциплину вводит студент (поле discipline), особенности предмета ИИ берёт из материалов.
# Оформление — класс mtuci-report (docs/templates.md).
# Разделы и ai_rules агент получает в каждом запросе к модели: писать коротко и не повторять
# промпт агента (backend/app/modules/agent/prompts/). Как выглядит результат — templates/_examples/.
slug: mtuci-lab
version: 3
kind: lab
title: "Лабораторная или практическая работа"
engine: xelatex
main: main.tex
fields:
  - key: discipline
    label: "Дисциплина"
    type: string
    required: true
  - key: lab_number
    label: "Номер работы"
    type: int
    required: true
  - key: lab_title
    label: "Тема работы"
    type: string
    required: true
  - key: variant
    label: "Вариант"
    type: string
  - key: teacher
    label: "Преподаватель (например, доц. Петров П. П.)"
    type: string
  - key: work_type
    label: "Вид работы"
    type: select
    options: ["Лабораторная работа", "Практическая работа"]
    default: "Лабораторная работа"
sections:
  - id: goal
    title: "Цель работы"
    file: sections/goal.tex
    required: true
    guide: >-
      1–2 предложения: цель из методички или задания, близко к тексту источника. Цели в
      материалах нет — раздел не заполнять, а в чате попросить методичку.
  - id: task
    title: "Задание"
    file: sections/task.tex
    required: true
    guide: >-
      Общая часть и пункты варианта студента словами источника, без пересказа и чужих вариантов.
      Пункты — bbttask с номерами методички: цифры — \begin{bbttask}, буквы — \begin{bbttask}[а];
      достались не все пункты — \item[5]. Пункт — со строчной буквы и «;» в конце, у каждого
      \label{task:...}. Исходные данные варианта (числа, параметры) — таблицей bbttable после
      пунктов.
  - id: theory
    title: "Теоретическая часть"
    file: sections/theory.tex
    required: false
    guide: >-
      Необязательный, по умолчанию не заполнять. Только если теорию требует методичка или просит
      студент: до страницы своими словами о том, на что опирается ход работы.
  - id: progress
    title: "Ход работы"
    file: sections/progress.tex
    required: true
    guide: |-
      На каждый пункт задания — \subsection{Название (пункт~\ref{task:...})}: что сделано, код,
      результат и короткий вывод по пункту. Код — фрагментами \bbtCodeFile: функция или её часть
      до ~40 строк; перед фрагментом — ссылка на него, под ним — что он делает. В пункте
      с результатами — что показали числа и почему: сравнение с ожиданием (теория, расчёт, условие
      задания) по данным из материалов, а не рассказ о том, как устроена программа. Всё, что
      требует задание и есть в материалах, — в отчёт: каждая требуемая таблица, все алгоритмы,
      классы входов и размеры из данных.
      По виду работы:
        - программы, запросы, ООП, ассемблер: фрагмент кода или запроса, результат — скриншот или
          вывод из материалов; результаты запросов, регистры и флаги — таблицей; тесты — что
          проверяют и итог прогона;
        - алгоритмы с замерами: оценка сложности, методика (размеры, повторы, медиана, окружение),
          таблица замеров, график; во сколько раз растёт время при удвоении n (в 2^k раз — наклон k
          на log-log графике: ≈1 — n, чуть больше 1 — n log n, ≈2 — n²) и почему различаются классы
          входов; проверка корректности;
        - логика и автоматы: таблица истинности или переходов, функции формулами (СДНФ,
          минимизация), карта Карно или граф, схема, проверка таблицей;
        - расчёт и моделирование: схема, расчёт формулами с подстановкой чисел, показания из
          материалов, таблица «расчёт — эксперимент — расхождение», графики; совпало ли и почему
          расходится;
        - настройка по шагам: команда или действие, скриншот, 1–2 предложения о том, что на нём
          видно, проверка (ping, статус), таблица адресов или настроек.
  - id: conclusion
    title: "Выводы"
    file: sections/conclusion.tex
    required: true
    guide: >-
      1–2 абзаца по цели работы: что сделано и что показали результаты, с главными числами из
      хода работы. Без новых фактов и чисел, без пересказа хода работы по пунктам.
  - id: questions
    title: "Ответы на контрольные вопросы"
    file: sections/questions.tex
    required: false
    guide: >-
      Необязательный. Если методичка требует ответы на вопросы в отчёте или просит студент, иначе —
      предложить в чате. На вопрос — абзац \textbf{N. Вопрос}, под ним ответ с опорой на ход работы.
ai_rules: |
  Отчёт — о сделанной работе: без обращений к студенту и фраз о том, чего нет в материалах («результаты нужно получить», «приложите вывод»). Нет вывода программы, скриншота или замеров — пункт без результата и без утверждений о нём («программа вывела», «проверка прошла»); какой файл загрузить — только в чате.
  Шрифты, отступы, пакеты, \newpage и \vspace не задавать — это делает класс mtuci-report.
  \section в начале файла — из шаблона, не менять; у необязательного раздела он закомментирован — убрать %, когда раздел нужен. Глубже \subsubsection нельзя.
  \bbtScreenshot и \bbtCodeFile — команды, не окружения. Рисунок — \bbtScreenshot[0.8\linewidth]{materials/....png}{Подпись}{fig:...}, только PNG или JPG.
  Код не переписывать и не сокращать — только \bbtCodeFile с lines=, длинную функцию — несколькими фрагментами по смыслу. Приложений нет.
  Единица — в шапке таблицы через запятую: «Время, мс». figure, table, lstlisting, verbatim и minted не использовать.
  Формула с номером — equation с \label{eq:...} и ссылкой «по формуле~\eqref{eq:...}», без ссылки — \[ … \]; пояснение следующей строкой, без пустой строки, со слова «где» без двоеточия.
  Подпись — с прописной буквы, без точки. На каждый рисунок, таблицу и листинг — ссылка в тексте до него: «в листинге~\ref{lst:...}», «в таблице~\ref{tab:...}». \ref — только на метки, которые есть в отчёте, и на пункты task:...; номера числом не писать.
  Имена из кода в тексте — \texttt{...}, «_» — \_ (в \label, \ref и путях — без \). ≥ ≤ ≠ × в тексте — символами, в формуле — \geq \leq \neq \times; \geqslant и \mathbb не работают.
  Перечисление: пункты со строчной буквы, в конце «;», у последнего «.». Кавычки — «ёлочки», внутри — „лапки“.
  Числа — с запятой и в удобных единицах (20,4 мкс, а не 2.04e-05), разряды — 31~996~000; «с», «мс», не «сек». Пересчёт единиц, округление и отношения чисел из материалов допустимы.
  Источники — только если есть \cite и они есть в материалах: thebibliography в конце main.tex.
  ФИО, группу, тему и вариант в текст не вписывать — только макросы \bbt...; \bbtTitlePage не трогать.
# Проверки отчёта — все однозначные проверки из docs/checks.md, часть 1.
checks:
  - build-failed
  - section-empty
  - placeholder
  - caption-missing
  - caption-format
  - ref-broken
  - ref-missing
  - ref-after
  - listing-too-long
  - file-missing
  - code-not-in-materials
  - number-not-in-materials
  - heading-format
  - list-format
  - formula-format
  - bib-order
  - manual-formatting
  - title-empty
  - text-overflow
  - missing-glyph
