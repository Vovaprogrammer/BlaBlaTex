# yaml-language-server: $schema=../_schema/template.schema.json
# Отчёт по лабораторной или практической работе МТУСИ — один шаблон на все дисциплины.
# Дисциплину вводит студент (поле discipline), особенности предмета ИИ берёт из материалов.
# Оформление — класс mtuci-report (docs/templates.md).
slug: mtuci-lab
version: 1
kind: lab
title: "Лабораторная или практическая работа"
engine: xelatex
main: main.tex
fields:
  - key: discipline
    label: "Дисциплина"
    type: string
    required: true
  - key: lab_number
    label: "Номер работы"
    type: int
    required: true
  - key: lab_title
    label: "Тема работы"
    type: string
    required: true
  - key: variant
    label: "Вариант"
    type: string
  - key: teacher
    label: "Преподаватель (например, доц. Петров П. П.)"
    type: string
  - key: work_type
    label: "Вид работы"
    type: select
    options: ["Лабораторная работа", "Практическая работа"]
    default: "Лабораторная работа"
sections:
  - id: goal
    title: "Цель работы"
    file: sections/goal.tex
    required: true
    guide: >-
      1–2 предложения: цель из методички или задания, близко к тексту источника.
      Цели в материалах нет — раздел не заполнять и сказать студенту, чего не хватает.
  - id: task
    title: "Задание"
    file: sections/task.tex
    required: true
    guide: >-
      Задание из материалов: общая часть и пункты варианта студента, без чужих вариантов.
      Пункты — списком enumerate, чтобы ход работы ссылался на них. Формулировки — из источника,
      без пересказа; оформление пунктов — по правилам перечислений.
  - id: progress
    title: "Ход работы"
    file: sections/progress.tex
    required: true
    guide: >-
      По пунктам задания, на каждый пункт — \subsection: что и как сделано; код из materials/ —
      \bbtCodeFile (длинный код — в приложение); результат —
      скриншот \bbtScreenshot; замеры — таблица bbttable. На каждый рисунок, листинг и таблицу —
      ссылка в тексте до них. Вывод программы и числа — только из материалов.
  - id: conclusion
    title: "Выводы"
    file: sections/conclusion.tex
    required: true
    guide: >-
      1–2 абзаца по цели работы: что сделано и что получилось. Только то, что есть в ходе
      работы, без новых фактов и чисел.
ai_rules: |
  Шаблон один на все дисциплины. Дисциплина — в поле «Дисциплина», особенности предмета — в методичке и задании из materials/.
  Оформление задаёт класс mtuci-report. Шрифты, поля, интервалы и отступы не задавать, пакеты не подключать, \newpage и \vspace не писать.
  Заголовок \section в начале файла раздела — из шаблона, его не менять. Внутри раздела — \subsection и \subsubsection, глубже нельзя.
  Рисунок — \bbtScreenshot[ширина]{путь}{подпись}{метка}, только PNG или JPG из materials/: PDF, документы и SVG в сборку не попадают.
  Код из файла — \bbtCodeFile[язык]{путь}{подпись}{метка}. Код текстом — \begin{bbtcode}{язык}{подпись}{метка}, код со следующей строки, \end{bbtcode} — с начала строки.
  Таблица — \begin{bbttable}{подпись}{метка}, внутри один tabular без окружения table; первая строка — шапка.
  figure, table, lstlisting, verbatim и minted не использовать — только макросы класса.
  Подпись — с прописной буквы, без точки в конце, номер ставит класс. На каждый рисунок, листинг и таблицу — ссылка в тексте до них: «на рисунке~\ref{fig:...}», «в листинге~\ref{lst:...}», «в таблице~\ref{tab:...}».
  Перечисление: пункты со строчной буквы, в конце «;», у последнего «.».
  Код длиннее ~40 строк — целиком в приложение. Приложения — в main.tex после \input{sections/conclusion}: \appendix, затем для каждого \section{Название}\label{app:...} и \bbtCodeFile. В тексте — «(приложение~\ref{app:...})».
  Список источников — только если в тексте есть \cite и источники есть в материалах: thebibliography в main.tex после \input{sections/conclusion}, перед \appendix.
  Факты, числа, вывод программ и источники — только из материалов. Чего в них нет — не выдумывать, а написать студенту, чего не хватает.
  Данные студента и работы — только макросами \bbt...: ФИО, группу, тему, вариант и преподавателя в текст не вписывать. meta.tex и \bbtTitlePage в main.tex не трогать.
# Проверки отчёта — все однозначные проверки из docs/checks.md, часть 1.
checks:
  - build-failed
  - section-empty
  - placeholder
  - caption-missing
  - caption-format
  - ref-broken
  - ref-missing
  - ref-after
  - listing-too-long
  - file-missing
  - code-not-in-materials
  - number-not-in-materials
  - heading-format
  - list-format
  - formula-format
  - bib-order
  - manual-formatting
  - title-empty
  - text-overflow
  - missing-glyph
