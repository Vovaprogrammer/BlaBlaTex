<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141316" />
    <meta name="description" content="BlaBlaTex — отчёты по шаблону вашей дисциплины." />
    <title>BlaBlaTex</title>
    <script>
      try {
        document.documentElement.classList.toggle(
          'dark',
          localStorage.getItem('bbt-theme') !== 'light',
        );
      } catch {
        /* Тёмная тема остаётся доступной без хранилища. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
