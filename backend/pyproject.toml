[project]
name = "blablatex-backend"
version = "0.1.0"
description = "BlaBlaTex API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "ASYNC", # блокирующие вызовы в async-коде
    "T20",   # print запрещён — только structlog
    "RUF",
]
# Похожие на латиницу символы: срабатывают на любой кириллице в строках и комментариях.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Alembic: команды — из папки backend/, например `uv run alembic upgrade head`.
# Настройки здесь, а не в alembic.ini: ini Alembic читает в кодировке системы,
# и на Windows русский текст в нём ломает запуск. Адрес базы — из настроек
# приложения (migrations/env.py), пароля здесь нет.
[tool.alembic]
script_location = "%(here)s/migrations"
# Дата в начале имени файла — порядок миграций виден в списке файлов.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["%(here)s"]
# Иначе на Windows миграция с русским текстом запишется в cp1251.
output_encoding = "utf-8"

# Новая миграция сразу приводится к правилам ruff — иначе упадёт backend-lint.
[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
