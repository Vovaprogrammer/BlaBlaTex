# BlaBlaTex из готовых образов (architecture.md 13): docs/install.md — для студента,
# docs/deploy.md — для администратора вуза.
#
# На компьютере студента этот файл скачивать не нужно — его берёт из реестра сама команда:
#   docker compose -f oci://ghcr.io/vovaprogrammer/blablatex:latest up -d --wait -y
# Сайт — http://localhost:8765, и открыт он только с этого компьютера.
# На сервере вуза — вместе с compose.server.yaml и .env (docs/deploy.md).
#
# Пароль базы и ключ шифрования создаёт сервис init при первом запуске: они лежат в томе
# secrets, рядом с данными. Миграции применяет migrate при каждом запуске. Проекты — в томах
# Docker: обновление их не трогает, удаляет только `down -v`.
#
# Настройки — переменные окружения или .env в папке, откуда запускают команду:
# - BBT_PORT — порт сайта на localhost, по умолчанию 8765;
# - BBT_VERSION — версия образов, BBT_REGISTRY — откуда их брать (например, зеркало вуза);
# - BBT_EDGE_SUBNET — подсеть между Caddy и API, если 10.255.255.0/28 уже занята;
# - LLM_PROVIDERS, LLM_DEFAULT_PROVIDER и другие настройки бэкенда ниже — как в .env.example
#   в репозитории. Без LLM_* работает всё, кроме чата на сайте: агенту через MCP ключ не нужен.
name: blablatex-app

# Логи контейнеров: до 3 файлов по 10 МБ на сервис. Без ограничения Docker копит их, пока не
# кончится диск.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-backend: &backend
  image: ${BBT_REGISTRY:-ghcr.io/vovaprogrammer}/blablatex-backend:${BBT_VERSION:-edge}
  # Образы только amd64: на Mac с Apple Silicon Docker Desktop запускает их через Rosetta.
  platform: linux/amd64
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  restart: unless-stopped

# Настройки бэкенда (app/core/config.py). Пустое значение — значение по умолчанию.
x-backend-env: &backend-env
  # local — компьютер студента: сайт по http, cookie без Secure. На сервере — prod.
  APP_ENV: local
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  COMPILER_URL: http://compiler:8080
  LOG_LEVEL: ${LOG_LEVEL:-}
  LLM_PROVIDERS: ${LLM_PROVIDERS:-}
  LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-}
  LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
  LLM_DAILY_TOKEN_LIMIT: ${LLM_DAILY_TOKEN_LIMIT:-}
  AGENT_RUN_MAX_TOKENS: ${AGENT_RUN_MAX_TOKENS:-}
  MATERIAL_DESCRIBE_IMAGES: ${MATERIAL_DESCRIBE_IMAGES:-}
  # Пусто — ключ из тома secrets. Задают только на время смены ключа (docs/deploy.md).
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}

services:
  # Пароль базы и ключ шифрования: создаются при первом запуске и дальше не меняются.
  init:
    <<: *backend
    command: ["python", "-m", "app.scripts.init_secrets"]
    volumes:
      - secrets:/run/secrets/blablatex
    network_mode: none
    restart: "no"

  postgres:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_USER: blablatex
      POSTGRES_DB: blablatex
      POSTGRES_PASSWORD_FILE: /run/secrets/blablatex/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/run/secrets/blablatex:ro
    networks: [data]
    healthcheck:
      # По TCP: при первой инициализации временный сервер слушает только сокет.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U blablatex -d blablatex"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      init:
        condition: service_completed_successfully
    logging: *logging
    restart: unless-stopped

  # Очередь задач воркера и события проектов.
  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    volumes:
      - secrets:/run/secrets/blablatex:ro
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Сборка LaTeX в песочнице (architecture.md 6, 9.7): без интернета и без секретов, флаги
  # и лимиты — как в docker-compose.yml для разработки.
  compiler:
    image: ${BBT_REGISTRY:-ghcr.io/vovaprogrammer}/blablatex-compiler:${BBT_VERSION:-edge}
    platform: linux/amd64
    networks: [compiler]
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
      # uid/gid 10001 — пользователь compiler из compiler/Dockerfile.
      - /home/compiler:size=64m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging
    restart: unless-stopped

  api:
    <<: *backend
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --no-server-header
      # Дольше, чем Caddy держит свободное соединение (2 минуты): иначе uvicorn закрыл бы его
      # через 5 секунд в тот момент, когда Caddy шлёт по нему запрос, и студент получил бы 502.
      - --timeout-keep-alive=150
    environment:
      <<: *backend-env
      # Адрес клиента для лимитов — из X-Forwarded-For, но только от Caddy (architecture.md 13).
      FORWARDED_ALLOW_IPS: ${BBT_EDGE_SUBNET:-10.255.255.0/28}
    volumes:
      - storage:/srv/storage
      - secrets:/run/secrets/blablatex:ro
    # К компилятору — за версией: по ней проверки находят сборку текущих файлов (9.1).
    networks: [edge, egress, data, compiler]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      compiler:
        condition: service_healthy

  # Сборки, прогоны агента, текст материалов, ночная уборка хранилища.
  worker:
    <<: *backend
    environment: *backend-env
    volumes:
      - storage:/srv/storage
      - secrets:/run/secrets/blablatex:ro
    networks: [egress, data, compiler]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      compiler:
        condition: service_healthy

  # Caddy: сайт и /api (frontend/Caddyfile). Наружу открыт только он.
  web:
    image: ${BBT_REGISTRY:-ghcr.io/vovaprogrammer}/blablatex-web:${BBT_VERSION:-edge}
    platform: linux/amd64
    environment:
      BBT_SITE_ADDRESS: ":80"
    ports:
      # Только localhost: из сети кафе или общежития сайт не виден. Полная запись: короткую
      # с переменной внутри не принимает публикация файла в реестр (compose publish).
      - target: 80
        host_ip: 127.0.0.1
        published: "${BBT_PORT:-8765}"
    volumes:
      # Сертификаты и ключи Caddy: без тома он получал бы сертификат при каждом запуске.
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks: [public, edge]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

networks:
  # Сайт снаружи: порт на хосте и получение сертификата.
  public: {}
  # Caddy → API, больше никого: только из этой подсети API верит X-Forwarded-For.
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${BBT_EDGE_SUBNET:-10.255.255.0/28}
  # Выход в интернет у API и воркера — к провайдеру LLM.
  egress: {}
  # База и Redis — без интернета.
  data:
    internal: true
  # Компилятор — без интернета (architecture.md 6).
  compiler:
    internal: true

volumes:
  pgdata:
  redisdata:
  storage:
  secrets:
  caddy-data:
  caddy-config:
