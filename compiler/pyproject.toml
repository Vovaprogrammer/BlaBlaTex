[project]
name = "blablatex-compiler"
version = "0.1.0"
description = "BlaBlaTex: сервис компиляции LaTeX"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "ASYNC", # блокирующие вызовы в async-коде
    "T20",   # print запрещён — только structlog
    "RUF",
]
# Похожие на латиницу символы: срабатывают на любой кириллице в строках и комментариях.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Одинаковые имена файлов в tests/unit и tests/container не конфликтуют.
addopts = "--import-mode=importlib"
markers = [
    "container: тесты против собранного образа, нужен Docker",
]
