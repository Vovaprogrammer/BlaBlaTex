[project]
name = "blablatex-llm-bench"
version = "0.1.0"
description = "Бенчмарк OpenAI-совместимых LLM-провайдеров"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28.1,<0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_bench"]

[tool.uv]
required-version = ">=0.13.6,<0.14"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1", "ruff>=0.17.3"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "T20", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
