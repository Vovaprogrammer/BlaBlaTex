name: backend

# Линтер и тесты бэкенда. Имена jobs — обязательные проверки в защите веток.
# Фильтра по путям нет намеренно: пропущенная обязательная проверка блокирует мёрж.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop] # прогрев кэша uv: PR-ветки читают кэш базовой ветки

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: backend-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run --locked ruff check --output-format=github .

      - name: Ruff format
        run: uv run --locked ruff format --check .

  test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Тесты пока не ходят в базу; подключение (DATABASE_URL) добавит B1.1.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Одноразовая база только для CI, не секрет.
          POSTGRES_USER: blablatex
          POSTGRES_PASSWORD: blablatex
          POSTGRES_DB: blablatex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U blablatex -d blablatex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run --locked pytest
