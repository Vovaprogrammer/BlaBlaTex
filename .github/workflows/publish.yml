name: publish

# Готовые образы для установки одной командой — в GitHub Container Registry:
# blablatex-backend (API и воркер), blablatex-compiler и blablatex-web (сайт и Caddy).
# Рядом — сам deploy/compose.yaml как пакет blablatex: его команда установки берёт из реестра
# (docs/install.md). В нём закреплены образы той же версии, поэтому файл и образы не разъедутся.
# - Тег версии v2.0.0 → образы 2.0.0, 2.0 и latest. У предвыпуска вроде v2.1.0-rc.1 —
#   только сама версия: latest остаётся у последнего настоящего выпуска.
# - Ручной запуск из develop (Actions → publish → Run workflow) → образы edge, для показов.
# - В PR образы только собираются, без публикации: проверка, что Dockerfile не сломан.
# Только amd64: базовый образ компилятора есть только под amd64 (compiler/Dockerfile),
# Mac с Apple Silicon запускает такие образы через Rosetta.
# Пакет в GitHub после первой публикации — закрытый: открыть его один раз в настройках пакета.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "compiler/Dockerfile"
      - "compiler/.dockerignore"
      - "compiler/pyproject.toml"
      - "compiler/uv.lock"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - "frontend/Caddyfile"
      # Встроенный скрипт index.html разрешён в CSP по отпечатку (frontend/Dockerfile).
      - "frontend/index.html"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "deploy/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.pull_request.number || github.ref }}
  # Публикацию выпуска не прерываем на середине: часть образов была бы новой, часть — старой.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: publish-${{ matrix.image }}
    # edge — только из develop: иначе им стала бы любая ветка, с которой нажали кнопку.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: compiler
            context: compiler
          - image: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Драйвер docker, а не отдельный сборщик: образ компилятора — около 9 ГБ, и его копия
      # в сборщике не поместилась бы на диск раннера. Кэша сборки поэтому нет, да и кэш
      # GitHub — 10 ГБ на весь репозиторий.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # Имя образа в реестре — только строчными буквами.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/blablatex-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=pr

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Второй контекст — папка templates/: из неё в образы кладутся шаблоны и общий класс.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-contexts: templates=templates
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Файлы установки: в PR — только проверка, что Docker их принимает; дальше — публикация.
  compose:
    name: publish-compose
    needs: images
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Релиз GitHub с файлами для сервера вуза.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Своя версия Compose, закреплённая: публикация пакета compose появилась в 2.34, а на
      # раннере может стоять старше. Новая версия могла бы молча поменять формат пакета.
      - uses: docker/setup-compose-action@v2
        with:
          version: v5.7.1

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=edge
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Предвыпуск (2.1.0-rc.1) не становится latest: его ставят только по номеру.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi
          echo "package=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/blablatex" >> "$GITHUB_OUTPUT"

      # По умолчанию файлы берут образы edge; в выпуске — образы его же версии.
      - name: Pin image version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/\${BBT_VERSION:-edge}/\${BBT_VERSION:-$VERSION}/g" deploy/compose.yaml deploy/compose.server.yaml
          grep -q "BBT_VERSION:-$VERSION}" deploy/compose.yaml

      - name: Check compose files
        env:
          BBT_DOMAIN: blablatex.example.org
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.server.yaml config --quiet

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --yes: переменные в файле — это настройки установки, а не секреты.
      - name: Publish compose package
        if: github.event_name != 'pull_request'
        env:
          PACKAGE: ${{ steps.version.outputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
          STABLE: ${{ steps.version.outputs.stable }}
        run: |
          docker compose -f deploy/compose.yaml publish --yes "$PACKAGE:$VERSION"
          if [[ "$STABLE" == true ]]; then
            docker compose -f deploy/compose.yaml publish --yes "$PACKAGE:latest"
          fi

      # Админу вуза — файлы этого выпуска одним списком на странице релиза.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ steps.version.outputs.stable }}
        run: |
          flags=(--title "BlaBlaTex $GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "$STABLE" != true ]]; then flags+=(--prerelease); fi
          files=(deploy/compose.yaml deploy/compose.server.yaml deploy/server.env.example)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" "${files[@]}"
