# Формат кейса eval (T2.4). Раннер A2.5 читает кейсы из EVAL_DATA_DIR: <EVAL_DATA_DIR>/<id>/case.yaml.
# Настоящие комплекты лежат в закрытой папке команды и в репозиторий не попадают.
# Этот кейс вымышленный: его материалов не существует.
#
# Папка кейса:
#   materials/          — всё, что студент загрузил бы в сервис; раннер загружает папку целиком
#   reference/report.md — текст настоящего принятого отчёта без титульника (может не быть)
#   case.yaml           — этот файл

id: demo-01-binary-search # совпадает с именем папки кейса
benchmark: false # true — кейс входит в бенчмарк провайдеров (A0.1, сценарии «раздел отчёта» и «vision»)
source: "Вымышленная дисциплина / ЛР 1" # откуда комплект — для людей
kind: C # вид лабораторной A–I из разбора видов (C — алгоритмы с замерами)

# Поля проекта. Ключи — как в fields шаблона mtuci-lab (templates/mtuci-lab/template.yaml).
# Раннер создаёт проект из mtuci-lab с этими полями; преподаватель в кейсах не задаётся.
meta:
  discipline: "Алгоритмы и структуры данных"
  work_type: "Лабораторная работа"
  lab_number: 1
  lab_title: "Двоичный поиск и его сравнение с линейным"
  variant: "7"

# Что лежит в materials/ — пояснения для человека и для чек-листа; раннер их не читает.
# path — файл в папке кейса, или несколько через запятую, если они описываются вместе.
materials:
  - path: "materials/task.md"
    what: "задание: 3 пункта, сдать код и отчёт с таблицей замеров"
  - path: "materials/code/search.py"
    what: "линейный и двоичный поиск, замеры времени"
  - path: "materials/results.json"
    what: "медианы времени по размерам массива — источник всех чисел"

# Настоящий отчёт по этим материалам, если он есть.
reference:
  path: reference/report.md # null — отчёта нет
  quality: "хороший" # свободный текст: насколько отчёт годится в образец и почему

# Что должно быть в отчёте, который сделал агент. По этому чек-листу считаются метрики A2.5.
expected:
  sections: ["Цель работы", "Задание", "Ход работы", "Выводы"] # обязательные разделы, названия как в шаблоне
  optional_sections: [] # разделы, которые можно добавить; ключ необязателен
  progress: # пункты «Хода работы» и что в каждом обязательно
    - item: "1. Линейный поиск"
      must: ["листинг функции из search.py"]
    - item: "2. Двоичный поиск"
      must: ["листинг функции", "условие: массив отсортирован"]
    - item: "3. Замеры"
      must: ["таблица медиан из results.json", "вывод: какой поиск быстрее и с какого размера"]
  facts: # что обязано совпасть с материалами
    - "вариант 7"
    - "все времена — из results.json"
  must_not: # чего нельзя выдумывать
    - "времена, которых нет в results.json"
    - "вывод программы, которого нет в материалах"
