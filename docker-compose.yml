services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: blablatax-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - BACKEND_CORS_ORIGINS=["http://localhost:5173"]
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - backend_data:/app/data
      - ./backend/temp:/app/temp
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blablatax-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data: