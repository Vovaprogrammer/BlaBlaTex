# Инфраструктура для разработки и воркер. API и фронт запускаются локально, см. README.
# Переменные берутся из .env в корне (шаблон — .env.example).
name: blablatex

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blablatex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-blablatex}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # По TCP: при первой инициализации временный сервер слушает только сокет,
      # и проверка через сокет показала бы «healthy» раньше времени.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Сборка LaTeX в песочнице (architecture.md 6, 9.7). Первый запуск собирает образ:
  # скачивается около 2,6 ГБ, на диске — около 9 ГБ.
  compiler:
    build:
      context: ./compiler
      # Общий класс для образа (compiler/Dockerfile); в dev он ещё и смонтирован поверх.
      additional_contexts:
        templates: ./templates
    image: blablatex-compiler:dev
    # Пересобирать при каждом up: иначе после изменений в compiler/ работал бы старый образ.
    # Без изменений сборка берётся из кэша за секунды.
    pull_policy: build
    # Только внутренняя сеть: интернета нет, с хоста — через compiler-proxy.
    networks: [compiler]
    # Без env_file: секретов из .env в контейнере нет.
    read_only: true
    tmpfs:
      # Рабочие папки сборок.
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
      # Кэши fontconfig и TeX: корень только для чтения, а писать их движкам нужно.
      # uid/gid 10001 — пользователь compiler из compiler/Dockerfile, меняются вместе.
      - /home/compiler:size=64m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # PID 1 подбирает процессы, убитые по таймауту, — иначе копятся зомби и съедают pids_limit.
    init: true
    volumes:
      # Общий класс шаблонов. Если папки ещё нет, Docker создаст пустую.
      - ./templates/_shared:/opt/blablatex/tex:ro
      # Для check-template templates/<slug>: рабочая папка образа — /srv.
      - ./templates:/srv/templates:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Мост с хоста к компилятору: в dev бэкенд работает не в compose и внутреннюю сеть не видит.
  # Слушает только localhost; у самого компилятора выхода в интернет по-прежнему нет.
  compiler-proxy:
    image: alpine/socat:1.8.1.3
    command: ["tcp-listen:8080,fork,reuseaddr", "tcp-connect:compiler:8080"]
    networks: [default, compiler]
    ports:
      - "127.0.0.1:${COMPILER_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      compiler:
        condition: service_healthy
    restart: unless-stopped

  # Воркер: задачи из очереди — сборки, позже прогоны агента и извлечение текста
  # (architecture.md 2). API в dev работает на хосте, а воркер — здесь; он видит ту же
  # базу, Redis и папку хранилища, а компилятор — напрямую по внутренней сети.
  worker:
    build:
      context: ./backend
      # Шаблоны для образа (backend/Dockerfile); в dev они ещё и смонтированы поверх.
      additional_contexts:
        templates: ./templates
    image: blablatex-worker:dev
    # Пересобирать при каждом up: иначе после правок кода работал бы старый образ.
    pull_policy: build
    # Пароль базы и другие настройки бэкенда. Без .env compose тоже запускается
    # (например, в CI ради одного компилятора): пароль тогда задаёт окружение.
    env_file:
      - path: .env
        required: false
    # Адреса внутри compose. environment сильнее env_file: POSTGRES_PORT в .env — это
    # порт на хосте, а здесь нужен порт внутри сети.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      COMPILER_URL: http://compiler:8080
      STORAGE_DIR: /srv/storage
      # Путь внутри контейнера: свой TEMPLATES_DIR из .env (путь на хосте для API) сюда не
      # попадёт, и воркер не останется без шаблонов.
      TEMPLATES_DIR: /opt/blablatex/templates
    volumes:
      # Та же папка хранилища, что у API на хосте: PDF, собранный воркером, API отдаёт
      # отсюда. Свой STORAGE_DIR в .env — только абсолютным путём, его видят оба.
      - ${STORAGE_DIR:-./backend/data/storage}:/srv/storage
      # Шаблоны отчётов: их реестр воркер читает при старте (инструменты агента), без папки
      # он не запустится. Путь — TEMPLATES_DIR выше.
      - ./templates:/opt/blablatex/templates:ro
    networks: [default, compiler]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compiler:
        condition: service_healthy
    restart: unless-stopped

networks:
  compiler:
    internal: true

volumes:
  pgdata:
  redisdata:
